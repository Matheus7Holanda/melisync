server.port=8080

spring.application.name=ml-vhsys-integration

# ---------------------------------------------------------------------------
# Banco H2 para desenvolvimento local (arquivo em ./data/ml-vhsys-db).
# CORRIGIDO: antes o arquivo estava em sintaxe YAML dentro de um .properties,
# entao nenhuma dessas chaves era lida pelo Spring. Agora esta no formato
# chave=valor correto.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/ml-vhsys-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Credenciais do Mercado Livre (app criado em https://developers.mercadolivre.com.br)
# NUNCA commitar valores reais aqui: use variaveis de ambiente em producao.
# ---------------------------------------------------------------------------
mercadolivre.client-id=${ML_CLIENT_ID:}
mercadolivre.client-secret=${ML_CLIENT_SECRET:}
mercadolivre.redirect-uri=${ML_REDIRECT_URI:http://localhost:8080/auth/mercadolivre/callback}
mercadolivre.seller-id=${ML_SELLER_ID:}
mercadolivre.api-base-url=https://api.mercadolibre.com
# Dias antes do dia consultado em que buscamos pedidos (o envio pode sair dias depois do pedido)
mercadolivre.dias-retroativos=${ML_DIAS_RETROATIVOS:10}
# O que significa "envios do dia": ENVIOS_DE_HOJE (lista "Envios de hoje" do ML, padrao), CRIACAO_PEDIDO (pedidos criados no dia) ou SAIDA_ENVIO (envios que sairam no dia)
mercadolivre.criterio-data=${ML_CRITERIO_DATA:ENVIOS_DE_HOJE}

# ---------------------------------------------------------------------------
# VHSYS -- confirmado na documentacao oficial (base URL, autenticacao por
# header, e o fluxo de venda balcao em duas chamadas). Nao existe conceito
# de "id_pdv" na API real.
# ---------------------------------------------------------------------------
vhsys.access-token=${VHSYS_ACCESS_TOKEN:}
vhsys.secret-access-token=${VHSYS_SECRET_ACCESS_TOKEN:}
vhsys.api-base-url=${VHSYS_API_BASE_URL:https://api.vhsys.com/v2}
vhsys.user-agent=${VHSYS_USER_AGENT:integracao-vhsys-ml/1.0}

logging.level.com.example.demo=DEBUG

# false (padrao): o estoque baixa quando voce conclui o PDV no VHSYS.
# true: a API baixa o estoque assim que a venda e enviada (nao use junto com a conclusao manual).
vhsys.lancar-estoque=${VHSYS_LANCAR_ESTOQUE:false}
