server.port=8080

spring.application.name=ml-vhsys-integration

# ---------------------------------------------------------------------------
# Banco H2 para desenvolvimento local (arquivo em ./data/ml-vhsys-db).
# CORRIGIDO: antes o arquivo estava em sintaxe YAML dentro de um .properties,
# entao nenhuma dessas chaves era lida pelo Spring. Agora esta no formato
# chave=valor correto.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/ml-vhsys-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Credenciais do Mercado Livre (app criado em https://developers.mercadolivre.com.br)
# NUNCA commitar valores reais aqui: use variaveis de ambiente em producao.
# ---------------------------------------------------------------------------
mercadolivre.client-id=${ML_CLIENT_ID:}
mercadolivre.client-secret=${ML_CLIENT_SECRET:}
mercadolivre.redirect-uri=${ML_REDIRECT_URI:http://localhost:8080/auth/mercadolivre/callback}
mercadolivre.seller-id=${ML_SELLER_ID:}
mercadolivre.api-base-url=https://api.mercadolibre.com

# ---------------------------------------------------------------------------
# Credenciais do VHSYS. O formato exato (access_token / secret_access_token,
# nomes de header ou query param) precisa ser confirmado na doc da sua conta.
# Ajuste VhsysProperties e VhsysClient assim que tiver essa confirmacao.
# ---------------------------------------------------------------------------
vhsys.access-token=${VHSYS_ACCESS_TOKEN:}
vhsys.secret-access-token=${VHSYS_SECRET_ACCESS_TOKEN:}
vhsys.api-base-url=${VHSYS_API_BASE_URL:https://api.vhsys.com/v2}
vhsys.user-agent=${VHSYS_USER_AGENT:integracao-vhsys-ml/1.0}

logging.level.com.example.demo=DEBUG
